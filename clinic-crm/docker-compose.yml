services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_password
      POSTGRES_DB: clinic_crm
    ports:
      - '5432:5432'
    volumes:
      - clinic-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d clinic_crm']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clinic-db:
